<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10251f">
<title>Tamil Islamic Video Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#10251f;--card:#183629;--ink:#f4efe0;--gold:#e0b84c;--mut:#a9bdb3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Tamil",system-ui,sans-serif;padding:16px;max-width:760px;margin:auto}
h1{font-size:24px;margin:8px 0}h2{font-size:18px;color:var(--gold)}
.tag{color:var(--gold);font-size:12px;letter-spacing:1px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:12px 0}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:14px}
input[type=text],select{width:100%;padding:12px;border-radius:10px;border:1px solid #2f5a47;background:#0d1d18;color:var(--ink);font:inherit;font-size:16px}
button{padding:12px 16px;border:0;border-radius:10px;background:var(--gold);color:#10251f;font:inherit;font-weight:700;margin:6px 6px 0 0;cursor:pointer}
button.alt{background:#2f5a47;color:var(--ink)}button:disabled{opacity:.45}
canvas{width:100%;border-radius:12px;background:#000;display:block}
#status{color:var(--gold);min-height:22px;margin-top:8px;font-size:14px}
#list{max-height:260px;overflow:auto;font-size:14px;line-height:1.6}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
small{color:var(--mut)}
</style>
</head>
<body>
<div class="tag">FREE • NO API KEY • TAMIL • ISLAMIC EDUCATION</div>
<h1>தமிழ் AI வீடியோ ஸ்டுடியோ</h1>
<small>தலைப்பை உள்ளிடுங்கள் → ஸ்கிரிப்ட், படங்கள், தமிழ் குரல், subtitles, background music உடன் வீடியோ தயாராகும். API key தேவையில்லை.</small>

<div class="card">
<label>வீடியோ தலைப்பு / Topic</label>
<input type="text" id="topic" placeholder="எ.கா: ரமலானின் சிறப்புகள்">
<div class="row">
<div style="flex:1"><label>நீளம்</label><select id="len"><option value="6">சுமார் 3 நிமிடம்</option><option value="9" selected>சுமார் 5 நிமிடம்</option><option value="12">சுமார் 7 நிமிடம்</option></select></div>
<div style="flex:1"><label>Format</label><select id="fmt"><option value="16:9">16:9 YouTube</option><option value="9:16">9:16 Shorts/Reels</option><option value="1:1">1:1 Square</option></select></div>
